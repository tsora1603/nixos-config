name: Check configuration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31

      - name: Evaluate configuration
        run: nix flake check --no-build --no-write-lock-file

      - name: Build Tidaler and run smoke checks
        run: nix build --no-link --no-write-lock-file .#tidaler

      - name: Confirm tracked files are unchanged
        run: git diff --exit-code